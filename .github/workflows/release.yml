name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Linux binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/linux/amd64/stcm-viewer ./src/main.go
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/linux/arm64/stcm-viewer ./src/main.go
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o dist/linux/armv7/stcm-viewer ./src/main.go

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/linux/

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows binary
        run: |
          go build -ldflags="-s -w" -o dist/windows/stcm-viewer.exe ./src/main.go

      - name: Install NSIS
        run: choco install nsis -y

      - name: Add NSIS to PATH
        run: |
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build NSIS installer
        run: |
          makensis packaging/windows/installer.nsi
          copy dist/windows/stcm-viewer-setup.exe dist/windows/

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/windows/

  build-deb:
    name: Build .deb package
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist/linux/

      - name: Build amd64 .deb
        run: |
          chmod +x dist/linux/amd64/stcm-viewer
          mkdir -p packaging/deb/amd64/DEBIAN packaging/deb/amd64/usr/local/bin
          cp packaging/deb/DEBIAN/control packaging/deb/amd64/DEBIAN/control
          sed -i 's/Architecture: .*/Architecture: amd64/' packaging/deb/amd64/DEBIAN/control
          cp dist/linux/amd64/stcm-viewer packaging/deb/amd64/usr/local/bin/
          dpkg-deb --build packaging/deb/amd64 dist/stcm-viewer-linux-amd64.deb

      - name: Build arm64 .deb
        run: |
          chmod +x dist/linux/arm64/stcm-viewer
          mkdir -p packaging/deb/arm64/DEBIAN packaging/deb/arm64/usr/local/bin
          cp packaging/deb/DEBIAN/control packaging/deb/arm64/DEBIAN/control
          sed -i 's/Architecture: .*/Architecture: arm64/' packaging/deb/arm64/DEBIAN/control
          cp dist/linux/arm64/stcm-viewer packaging/deb/arm64/usr/local/bin/
          dpkg-deb --build packaging/deb/arm64 dist/stcm-viewer-linux-arm64.deb

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: dist/*.deb

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
